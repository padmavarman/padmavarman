<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <!-- Sky gradient matching the blue-grey from the reference -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7B8FA8"/>
      <stop offset="40%" style="stop-color:#9FAFC2"/>
      <stop offset="70%" style="stop-color:#C8B8C8"/>
      <stop offset="100%" style="stop-color:#E8C8D8"/>
    </linearGradient>

    <!-- Cloud gradient -->
    <radialGradient id="cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#F0E0EA;stop-opacity:0.4"/>
    </radialGradient>

    <!-- Mountain gradient -->
    <linearGradient id="mountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C8A0C0"/>
      <stop offset="100%" style="stop-color:#E0B8D0"/>
    </linearGradient>

    <!-- Petal shape -->
    <path id="petal" d="M0,-4 C2,-4 4,-2 4,0 C4,2 2,4 0,3 C-2,4 -4,2 -4,0 C-4,-2 -2,-4 0,-4Z" fill="#F5B0C0" opacity="0.7"/>

    <!-- Glow filter for moon -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft blur for clouds -->
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Star twinkle -->
    <radialGradient id="star">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Sky background -->
  <rect width="900" height="300" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="120" cy="30" r="1" fill="white" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="55" r="0.8" fill="white" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="25" r="1" fill="white" opacity="0.5">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="40" r="0.7" fill="white" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="20" r="1" fill="white" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="60" r="0.6" fill="white" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="340" cy="70" r="0.8" fill="white" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="15" r="0.9" fill="white" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="75" r="0.7" fill="white" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="50" r="0.8" fill="white" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="35" r="0.6" fill="white" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Moon -->
  <circle cx="650" cy="65" r="22" fill="#FFF8E8" filter="url(#glow)" opacity="0.85"/>
  <circle cx="658" cy="60" r="20" fill="url(#sky)" opacity="0.3"/>

  <!-- Clouds -->
  <ellipse cx="200" cy="130" rx="120" ry="35" fill="white" opacity="0.5" filter="url(#softBlur)"/>
  <ellipse cx="500" cy="110" rx="150" ry="40" fill="white" opacity="0.45" filter="url(#softBlur)"/>
  <ellipse cx="750" cy="140" rx="130" ry="35" fill="white" opacity="0.4" filter="url(#softBlur)"/>
  <ellipse cx="100" cy="160" rx="100" ry="30" fill="#FFF0F5" opacity="0.4" filter="url(#softBlur)"/>
  <ellipse cx="400" cy="150" rx="110" ry="30" fill="white" opacity="0.35" filter="url(#softBlur)"/>

  <!-- Mountains -->
  <path d="M0,220 L80,150 L160,190 L280,130 L380,180 L450,145 L520,185 L620,125 L720,170 L800,140 L900,180 L900,300 L0,300Z" fill="url(#mountain)" opacity="0.6"/>
  <path d="M0,250 L100,200 L200,230 L350,180 L450,220 L550,190 L680,215 L800,185 L900,220 L900,300 L0,300Z" fill="#E8B8D0" opacity="0.5"/>

  <!-- Tree bottom glow -->
  <ellipse cx="450" cy="290" rx="450" ry="40" fill="#F0C0D0" opacity="0.3" filter="url(#softBlur)"/>

  <!-- Cherry blossom branch top-left -->
  <path d="M-10,0 Q40,30 80,25 Q120,22 150,40 Q170,48 185,45" stroke="#8B6070" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M80,25 Q95,10 110,15" stroke="#8B6070" stroke-width="1.8" fill="none" opacity="0.5"/>
  <path d="M130,32 Q140,18 155,22" stroke="#8B6070" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Blossoms on branch -->
  <circle cx="75" cy="22" r="5" fill="#F5B8C8" opacity="0.7"/>
  <circle cx="85" cy="18" r="4" fill="#F8C8D4" opacity="0.6"/>
  <circle cx="68" cy="28" r="3.5" fill="#FFCDD8" opacity="0.7"/>
  <circle cx="110" cy="15" r="4.5" fill="#F5B8C8" opacity="0.65"/>
  <circle cx="118" cy="20" r="3" fill="#F8D0DA" opacity="0.7"/>
  <circle cx="140" cy="30" r="5" fill="#F0B0C0" opacity="0.6"/>
  <circle cx="148" cy="25" r="3.5" fill="#F8C8D4" opacity="0.7"/>
  <circle cx="155" cy="22" r="4" fill="#FFD0DA" opacity="0.6"/>
  <circle cx="165" cy="38" r="4.5" fill="#F5B8C8" opacity="0.65"/>
  <circle cx="175" cy="42" r="3" fill="#F8D0DA" opacity="0.7"/>
  <circle cx="185" cy="44" r="4" fill="#F0B0C0" opacity="0.6"/>

  <!-- Cherry blossom branch top-right -->
  <path d="M910,10 Q870,30 840,28 Q800,25 770,45 Q750,55 735,50" stroke="#8B6070" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M840,28 Q825,12 808,18" stroke="#8B6070" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Blossoms on right branch -->
  <circle cx="845" cy="25" r="5" fill="#F5B8C8" opacity="0.65"/>
  <circle cx="835" cy="20" r="3.5" fill="#FFCDD8" opacity="0.7"/>
  <circle cx="810" cy="18" r="4" fill="#F8C8D4" opacity="0.6"/>
  <circle cx="800" cy="24" r="3" fill="#FFD0DA" opacity="0.7"/>
  <circle cx="775" cy="40" r="4.5" fill="#F0B0C0" opacity="0.65"/>
  <circle cx="765" cy="45" r="3.5" fill="#F8C8D4" opacity="0.7"/>
  <circle cx="740" cy="48" r="4" fill="#F5B8C8" opacity="0.6"/>

  <!-- Flying petals with animation -->
  <!-- Petal 1 -->
  <ellipse cx="0" cy="0" rx="4" ry="2.5" fill="#F5B8C8" opacity="0.6" transform="rotate(30)">
    <animateTransform attributeName="transform" type="translate" values="150,60;300,150;500,250;700,300" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.5;0.3;0" dur="8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0;90;180;360" dur="4s" repeatCount="indefinite" additive="sum"/>
  </ellipse>

  <!-- Petal 2 -->
  <ellipse cx="0" cy="0" rx="3.5" ry="2" fill="#FFCDD8" opacity="0.5" transform="rotate(60)">
    <animateTransform attributeName="transform" type="translate" values="300,30;420,100;550,200;680,300" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.5;0.3;0" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0;-90;-180;-360" dur="5s" repeatCount="indefinite" additive="sum"/>
  </ellipse>

  <!-- Petal 3 -->
  <ellipse cx="0" cy="0" rx="3" ry="2" fill="#F0B0C0" opacity="0.55">
    <animateTransform attributeName="transform" type="translate" values="500,20;580,80;660,180;750,300" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.5;0.2;0" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0;120;240;360" dur="3.5s" repeatCount="indefinite" additive="sum"/>
  </ellipse>

  <!-- Petal 4 -->
  <ellipse cx="0" cy="0" rx="3.5" ry="2" fill="#F8C8D4" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="80,40;200,120;350,220;480,300" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.4;0.2;0" dur="9s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0;-60;-180;-360" dur="6s" repeatCount="indefinite" additive="sum"/>
  </ellipse>

  <!-- Petal 5 -->
  <ellipse cx="0" cy="0" rx="4" ry="2.5" fill="#FFD0DA" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="650,10;700,90;760,180;830,280" dur="7.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.4;0.2;0" dur="7.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0;80;200;360" dur="4.5s" repeatCount="indefinite" additive="sum"/>
  </ellipse>

  <!-- Petal 6 -->
  <ellipse cx="0" cy="0" rx="3" ry="1.8" fill="#F5B8C8" opacity="0.45">
    <animateTransform attributeName="transform" type="translate" values="250,50;380,130;480,200;600,290" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.4;0.2;0" dur="11s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0;150;300;360" dur="5.5s" repeatCount="indefinite" additive="sum"/>
  </ellipse>

  <!-- Petal 7 -->
  <ellipse cx="0" cy="0" rx="3.5" ry="2.2" fill="#FFCDD8" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="420,15;500,100;590,190;700,280" dur="8.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.4;0.3;0" dur="8.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0;-100;-220;-360" dur="4s" repeatCount="indefinite" additive="sum"/>
  </ellipse>

  <!-- Name text -->
  <text x="450" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#FFFFFF" opacity="0.9" letter-spacing="3">Padma Priya Varman</text>
  <text x="450" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#F0D8E0" opacity="0.8" letter-spacing="4">DATA ANALYTICS &amp; BUSINESS INTELLIGENCE</text>

</svg>
